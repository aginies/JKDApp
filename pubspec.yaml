name: jkd_app
description: "JKD - Training Library"
publish_to: 'none'

version: 2.8.1+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.2
  sqflite_common: ^2.5.6
  path: ^1.9.1
  path_provider: ^2.1.5
  provider: ^6.1.5+1
  sqflite_common_ffi: ^2.4.0+2
  sqflite_common_ffi_web: ^1.2.0  # WASM SQLite for `flutter build web`
  sqlite3_flutter_libs: ^0.6.0+eol
  uuid: ^4.5.3
  file_picker: ^13.1.0
  pdf: ^3.12.0
  printing: ^5.14.3
  flutter_tts: ^4.2.5
  intl: ^0.20.2
  image_picker: ^1.2.1
  image: ^4.8.0
  archive: ^4.0.9
  speech_to_text: ^7.3.0
  permission_handler: ^13.0.2
  string_similarity: ^2.1.1
  record: ^7.1.2
  audioplayers: ^6.6.0
  share_plus: ^13.3.1
  video_player: ^2.14.1
  table_calendar: ^3.0.9
  flutter_local_notifications: ^21.0.0
  url_launcher: ^6.3.1
  flutter_markdown_plus: ^1.0.7
  crypto: ^3.0.3
  http: ^1.3.0
  audio_session: ^0.2.3
  wakelock_plus: ^1.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/JKD.png"
  min_sdk_android: 21
  linux:
    generate: true
    image_path: "assets/icon/JKD.png"
  windows:
    generate: true
    image_path: "assets/icon/JKD.png"
  macos:
    generate: true
    image_path: "assets/icon/JKD.png"
  web:
    generate: true
    image_path: "assets/icon/JKD.png"

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/icon/
    - assets/training_programs/
    - PRIVACY_POLICY.md
