name: jkd_app
description: "JKD - Training Library"
publish_to: 'none'

version: 1.3.0+2

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  provider: ^6.1.5+1
  sqflite_common_ffi: ^2.4.0+2
  sqlite3_flutter_libs: ^0.6.0+eol
  uuid: ^4.5.3
  file_picker: ^10.3.10
  pdf: ^3.12.0
  printing: ^5.14.3
  flutter_tts: ^4.2.5
  intl: ^0.20.2
  image_picker: ^1.2.1
  image: ^4.8.0
  archive: ^4.0.9
  speech_to_text: ^7.3.0
  permission_handler: ^12.0.1
  string_similarity: ^2.1.1
  record: ^6.2.0
  audioplayers: ^6.6.0
  share_plus: ^12.0.2
  table_calendar: ^3.0.9
  flutter_local_notifications: ^16.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/JKD.png"
  min_sdk_android: 21
  linux:
    generate: true
    image_path: "assets/icon/JKD.png"
  windows:
    generate: true
    image_path: "assets/icon/JKD.png"
  macos:
    generate: true
    image_path: "assets/icon/JKD.png"
  web:
    generate: true
    image_path: "assets/icon/JKD.png"

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/icon/
    - assets/training_programs/
