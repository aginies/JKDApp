name: wear_os_app
description: "JKD Training Library for Wear OS"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter

  # Shared with main app (MUST match versions in root pubspec)
  jkd_app:
    path: ..
  provider: ^6.1.5+1
  sqflite: ^2.4.2

  # Wear OS specific
  wearable_rotary: ^2.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/JKD.png"
  min_sdk_android: 23

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/icon/
    - assets/training_programs/
    - PRIVACY_POLICY.md
